{% extends 'onlinecourse/base.html' %}

{% block title %}Login | IBM Online Course App{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 shadow-sm border-0">
                <div class="text-center mb-4">
                    <i class="bi bi-person-circle display-4 text-primary"></i>
                    <h3 class="fw-bold mt-2">Sign In to Your Account</h3>
                    <p class="text-muted">Access your enrolled courses and assessment scores.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg" required id="id_username" placeholder="Enter username">
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg" required id="id_password" placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn-ibm-primary btn-lg w-100 mb-3">Sign In</button>
                    <div class="text-center">
                        <span class="text-muted small">Don't have an account?</span>
                        <a href="{% url 'onlinecourse:registration' %}" class="small fw-semibold ms-1">Register here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
